services:
  web:
    image: ghcr.io/kelostrada/fossil:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - "${PORT:-4003}:80"
    environment: &app_env
      # The database is the Air's shared MariaDB server (melinakrzemowa/air-infra,
      # services/mariadb): database `fossil`, user `fossil`, host `mariadb` on the
      # external `mariadb` network below. The per-site db service that used to
      # live here (mariadb:10.11, volume fossil_db) was retired on 2026-09-30;
      # air-infra keeps the rollback notes.
      DB_HOST: mariadb
      DB_USERNAME: ${DB_USERNAME:-fossil}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE:-fossil}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
      TZ: ${TZ:-Europe/Warsaw}
    volumes:
      - fossil_state:/var/www/state
    networks:
      - default
      - mariadb

  cron:
    image: ghcr.io/kelostrada/fossil:${VERSION:-latest}
    restart: unless-stopped
    user: www-data
    command: /usr/local/bin/fossil-cron
    environment: *app_env
    volumes:
      - fossil_state:/var/www/state
    networks:
      - default
      - mariadb

networks:
  mariadb:
    external: true

volumes:
  fossil_state:
    name: fossil_state
